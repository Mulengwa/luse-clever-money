name: Daily LuSE Wrap

# Primary use: Actions → Run workflow (on-demand) when your Windows
# self-hosted runner is online. Schedule only fires if the runner is up.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 1-5'   # 16:30 CAT weekdays (optional; skipped if runner offline)

jobs:
  daily:
    # Requires a self-hosted runner that can reach luse.co.zm
    # (GitHub-hosted runners are often blocked by Cloudflare).
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Prepare database
        run: python src/database.py

      - name: Scrape LuSE (official only)
        run: python src/scraper_v2.py

      - name: Generate post image
        run: python src/generate_posts.py

      - name: Generate caption
        run: python src/social_captions.py

      - name: Commit & push results
        shell: bash
        run: |
          git config user.name "CleverMoneyBot"
          git config user.email "bot@clevermoney.zm"
          git add posts/ || true
          git commit -m "Daily wrap $(date +%F)" || echo "no changes"
          git push || echo "push failed"
