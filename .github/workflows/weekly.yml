name: Weekly Carousel Sunday

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0'

jobs:
  weekly:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Python
        shell: bash
        run: |
          python --version || python3 --version
          pip --version || pip3 --version

      - name: Install Python deps
        shell: bash
        run: pip install -r requirements.txt

      - name: Prepare database
        shell: bash
        run: python src/database.py

      - name: Generate post (latest available data)
        shell: bash
        run: python src/generate_posts.py

      - name: Generate caption
        shell: bash
        run: python src/social_captions.py

      - name: Commit & push
        shell: bash
        run: |
          git config user.name "CleverMoneyBot"
          git config user.email "bot@clevermoney.zm"
          git add posts/ || true
          git commit -m "Weekly wrap $(date +%F)" || echo "no changes"
          git push || echo "push failed"
