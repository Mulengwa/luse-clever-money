name: Weekly Carousel Sunday

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0'

jobs:
  weekly:
    runs-on: self-hosted
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Python
        run: |
          python --version
          pip --version

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Prepare database
        run: python src/database.py

      - name: Generate post (latest available data)
        run: python src/generate_posts.py

      - name: Generate caption
        run: python src/social_captions.py

      - name: Commit & push
        run: |
          git config user.name "CleverMoneyBot"
          git config user.email "bot@clevermoney.zm"
          git add posts/
          git diff --staged --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "Weekly wrap $(Get-Date -Format yyyy-MM-dd)" } else { Write-Host "no changes" }
          git push
