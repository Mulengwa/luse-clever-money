name: Weekly Carousel Sunday

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0'   # Sunday 18:00 CAT (optional)

jobs:
  weekly:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Prepare database
        run: python src/database.py

      - name: Generate post (latest available data)
        run: python src/generate_posts.py

      - name: Generate caption
        run: python src/social_captions.py

      - name: Commit & push
        shell: bash
        run: |
          git config user.name "CleverMoneyBot"
          git config user.email "bot@clevermoney.zm"
          git add posts/ || true
          git commit -m "Weekly wrap $(date +%F)" || echo "no changes"
          git push || echo "push failed"
