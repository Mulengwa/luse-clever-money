name: Weekly Carousel Sunday
on:
  schedule:
    - cron: '0 16 * * 0'   # Sunday 18:00 CAT
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Prepare database
        run: python src/database.py

      - name: Generate post (uses latest available data)
        run: python src/generate_posts.py

      - name: Generate caption
        run: python src/social_captions.py

      - name: Commit & push
        run: |
          git config user.name "CleverMoneyBot"
          git config user.email "bot@clevermoney.zm"
          git add posts/ || true
          git commit -m "Weekly wrap $(date +%F)" || echo "no changes"
          git push || echo "push failed"
